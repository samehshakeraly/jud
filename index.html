<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مَنْ ومَنْ في القرآن الكريم</title>
  <meta name="description" content="آيات القرآن الكريم المبدوءة بـ«مَنْ» و«ومَنْ» — مع التفسير المختصر والميسر والهدايات القرآنية." />
  <meta name="theme-color" content="#8B6A2A" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11100F" media="(prefers-color-scheme: dark)" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23B58C3E'/><stop offset='100%25' stop-color='%234F5230'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><polygon points='32,8 39,18 51,18 45,28 51,38 39,38 32,48 25,38 13,38 19,28 13,18 25,18' fill='none' stroke='%23FCFBF7' stroke-width='1.6' stroke-linejoin='round'/></svg>" />

  <style>
    :root {
      --bg: #FCFBF7;
      --bg-elev: #FFFFFF;
      --surface: #F8F5EC;
      --fg: #1C1917;
      --fg-muted: #78716C;
      --border: #E6E2D7;
      --accent: #8B6A2A;
      --accent-soft: #F4F2E8;
      --olive: #4F5230;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
    }
    html.dark {
      --bg: #11100F;
      --bg-elev: #18161C;
      --surface: #1E1C1A;
      --fg: #EBE9E4;
      --fg-muted: #A8A29B;
      --border: #37322C;
      --accent: #C8A95A;
      --accent-soft: #26221C;
      --olive: #A4A86A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.6;
      background-image: radial-gradient(circle at 1px 1px, rgba(101,104,58,0.06) 1px, transparent 0);
      background-size: 22px 22px;
      transition: background-color .25s, color .25s;
    }
    html.dark body {
      background-image: radial-gradient(circle at 1px 1px, rgba(200,169,90,0.05) 1px, transparent 0);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    input, select { font: inherit; }

    .font-display { font-family: 'Amiri', serif; }
    .quran {
      font-family: 'Amiri Quran', 'Amiri', serif;
      line-height: 2.2;
      word-spacing: .05em;
    }

    /* ---------- Header ---------- */
    .header {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; padding: .5rem 1rem; height: 56px;
    }
    .logo-link { display: flex; align-items: center; gap: .5rem; }
    .logo {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--olive));
      color: white; display: grid; place-items: center;
      box-shadow: var(--shadow);
    }
    .brand-title { font-family: 'Amiri', serif; font-weight: 700; font-size: 1.05rem; line-height: 1.1; }
    .brand-title span { color: var(--accent); }
    .brand-sub { font-size: 11px; color: var(--fg-muted); }

    .nav { display: flex; align-items: center; gap: .25rem; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .35rem .7rem; border-radius: 999px; font-size: .85rem;
      color: var(--fg-muted); background: transparent; border: 0;
      transition: color .2s, background .2s;
    }
    .nav-btn:hover { color: var(--fg); }
    .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
    .nav-btn svg { width: 16px; height: 16px; }
    .nav-btn-text { display: none; }
    @media (min-width: 640px) { .nav-btn-text { display: inline; } }

    .theme-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--border); background: var(--bg-elev);
      padding: .35rem .75rem; border-radius: 999px; color: var(--fg);
      font-size: .8rem;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ---------- Main ---------- */
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 5rem; }
    .view { display: none; animation: fadeUp .35s ease-out both; }
    .view.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative; overflow: hidden;
      border: 1px solid var(--border); border-radius: 24px;
      background: linear-gradient(135deg, var(--bg-elev), var(--accent-soft));
      padding: 2rem 1.5rem; margin-bottom: 1.5rem;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .15;
    }
    .hero::before { background: var(--accent); width: 220px; height: 220px; left: -40px; top: -40px; }
    .hero::after { background: var(--olive); width: 220px; height: 220px; right: -30px; bottom: -50px; }
    .hero > * { position: relative; z-index: 1; }
    .pill {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      padding: .25rem .75rem; border-radius: 999px; font-size: 11px; font-weight: 500;
    }
    .hero h1 {
      font-family: 'Amiri', serif; font-weight: 900;
      font-size: clamp(2rem, 5vw, 3rem); margin: .75rem 0 .5rem; line-height: 1.15;
    }
    .hero h1 .w { color: var(--accent); }
    .hero h1 small { color: var(--fg-muted); font-weight: 700; }
    .hero p { color: var(--fg-muted); max-width: 640px; margin: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.25rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1rem; border-radius: 999px; font-size: .9rem; font-weight: 500;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--fg);
      transition: border-color .2s, background .2s, transform .15s, opacity .2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn.primary:hover { opacity: .9; }
    .btn svg { width: 16px; height: 16px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: 1.5rem;
    }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      border: 1px solid var(--border); background: var(--bg-elev);
      border-radius: 16px; padding: .75rem; text-align: center;
    }
    .stat-num { font-family: 'Amiri', serif; font-weight: 900; font-size: 1.5rem; }
    .stat-num.olive { color: var(--olive); }
    .stat-num.accent { color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--fg-muted); }

    /* ---------- Sura grid ---------- */
    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem;
    }
    .section-head h2 { font-family: 'Amiri', serif; font-size: 1.5rem; font-weight: 700; margin: 0; }
    .section-head p { font-size: .85rem; color: var(--fg-muted); margin: 0; }

    .sura-grid { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    @media (min-width: 640px) { .sura-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1024px) { .sura-grid { grid-template-columns: 1fr 1fr 1fr; } }

    .sura-card {
      display: flex; align-items: center; gap: .75rem;
      border: 1px solid var(--border); background: var(--bg-elev);
      border-radius: 16px; padding: .75rem;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .sura-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .sura-num {
      position: relative; width: 48px; height: 48px; flex-shrink: 0;
      display: grid; place-items: center;
    }
    .sura-num svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      color: var(--accent); opacity: .45; transition: opacity .2s;
    }
    .sura-card:hover .sura-num svg { opacity: 1; }
    .sura-num span { font-family: 'Amiri', serif; font-weight: 700; color: var(--accent); font-size: .85rem; position: relative; }
    .sura-info { flex: 1; min-width: 0; }
    .sura-info h3 { font-family: 'Amiri', serif; font-weight: 700; font-size: 1rem; margin: 0; }
    .sura-meta {
      display: flex; gap: .5rem; align-items: center;
      font-size: 11px; color: var(--fg-muted); margin-top: 2px;
    }
    .badge-olive { color: var(--olive); font-weight: 600; }
    .badge-accent { color: var(--accent); font-weight: 600; }

    /* ---------- Verse card ---------- */
    .verses-list { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    @media (min-width: 768px) { .verses-list { grid-template-columns: 1fr 1fr; } }

    .verse-card {
      display: block; padding: 1rem;
      border: 1px solid var(--border); background: var(--bg-elev); border-radius: 16px;
      transition: border-color .2s, box-shadow .2s;
    }
    .verse-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .verse-card-head {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem;
    }
    .tag {
      padding: .15rem .55rem; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    .tag.man { background: color-mix(in srgb, var(--olive) 15%, transparent); color: var(--olive); }
    .tag.waman { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .ayah-num {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 50%; font-size: 12px; font-weight: 700;
    }
    .verse-card .verse-text {
      font-size: 1.4rem; line-height: 2;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .verse-card .preview {
      margin-top: .5rem; font-size: .85rem; color: var(--fg-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .verse-card .sura-label { font-size: 12px; color: var(--fg-muted); font-weight: 500; }

    /* ---------- Verse detail ---------- */
    .breadcrumb {
      display: flex; align-items: center; justify-content: space-between;
      font-size: .85rem; color: var(--fg-muted); margin-bottom: 1rem; gap: .5rem;
      flex-wrap: wrap;
    }
    .breadcrumb a:hover { color: var(--accent); }

    .verse-frame {
      position: relative; padding: 2rem 1.5rem;
      border: 1px solid transparent; border-radius: 20px;
      background:
        linear-gradient(var(--bg-elev), var(--bg-elev)) padding-box,
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 50%, transparent), color-mix(in srgb, var(--olive) 30%, transparent) 50%, color-mix(in srgb, var(--accent) 50%, transparent)) border-box;
    }
    .verse-frame::before, .verse-frame::after {
      content: ''; position: absolute; width: 28px; height: 28px;
      border: 1.5px solid var(--accent); opacity: .55; border-radius: 4px;
    }
    .verse-frame::before { top: -1px; right: -1px; border-bottom: 0; border-left: 0; }
    .verse-frame::after { bottom: -1px; left: -1px; border-top: 0; border-right: 0; }

    .verse-frame .top-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .5rem; margin-bottom: 1rem;
    }
    .verse-detail-text {
      text-align: center; line-height: 2.4;
    }
    .verse-detail-text .quran-text { font-family: 'Amiri Quran', 'Amiri', serif; }
    .size-1 { font-size: 1.6rem; }
    .size-2 { font-size: 2rem; }
    .size-3 { font-size: 2.6rem; }
    .size-4 { font-size: 3.2rem; }
    @media (min-width: 768px) {
      .size-1 { font-size: 1.85rem; }
      .size-2 { font-size: 2.25rem; }
      .size-3 { font-size: 2.85rem; }
      .size-4 { font-size: 3.6rem; }
    }
    .ornament { color: var(--accent); }
    .ayah-marker {
      display: inline-grid; place-items: center;
      width: 2.3em; height: 2.3em; font-size: 0.5em;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent); font-weight: 700;
      border: 1.5px solid var(--accent);
      margin: 0 .3em; vertical-align: middle;
    }

    .actions-row {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; margin: 1rem 0;
    }
    .actions-row .group { display: flex; gap: .5rem; flex-wrap: wrap; }
    .btn-fav.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .btn-fav.active svg { fill: currentColor; }

    .panel {
      margin-top: 1.25rem; padding: 1rem;
      border: 1px solid var(--border); background: var(--bg-elev); border-radius: 16px;
    }
    @media (min-width: 768px) { .panel { padding: 1.5rem; } }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem;
    }
    .panel-head h2 { font-family: 'Amiri', serif; font-size: 1.1rem; margin: 0; }
    .panel-head .count { font-size: 11px; color: var(--fg-muted); }

    .tab-group {
      display: inline-flex; background: var(--surface); border-radius: 999px; padding: 2px; font-size: 12px;
    }
    .tab-btn {
      padding: .35rem .8rem; border-radius: 999px; border: 0; background: transparent; color: var(--fg-muted);
    }
    .tab-btn.active { background: var(--bg-elev); color: var(--accent); box-shadow: var(--shadow); }

    .hidayat-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    .hidayat-item {
      position: relative; padding: .85rem 3rem .85rem 1rem;
      background: var(--surface); border-radius: 12px; line-height: 1.7;
    }
    .hidayat-item::before {
      content: attr(data-n);
      position: absolute; right: .75rem; top: .75rem;
      display: grid; place-items: center; width: 28px; height: 28px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 50%; font-size: 11px; font-weight: 700;
    }

    .reflection {
      margin-top: 1.25rem; padding: 1rem;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      background: var(--accent-soft); border-radius: 16px;
    }
    .reflection h2 { color: var(--accent); }

    .nav-row {
      display: flex; gap: .5rem; margin-top: 2rem;
    }
    .nav-link {
      flex: 1; padding: .75rem; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg-elev);
      display: flex; align-items: center; gap: .5rem;
      transition: border-color .2s;
    }
    .nav-link:hover { border-color: var(--accent); }
    .nav-link .meta { font-size: 11px; color: var(--fg-muted); }
    .nav-link .name { font-size: .9rem; font-weight: 500; }
    .nav-link.next { justify-content: flex-end; text-align: left; }
    .nav-link.prev { text-align: right; }

    .keyboard-hint {
      margin-top: 1rem; text-align: center; font-size: 11px; color: var(--fg-muted);
    }

    /* ---------- Search ---------- */
    .search-bar {
      position: sticky; top: 56px; z-index: 30;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
      padding: 1rem; margin: -1rem -1rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .search-input-wrap { position: relative; }
    .search-input {
      width: 100%; padding: .65rem 1rem .65rem 2.5rem;
      border: 1px solid var(--border); background: var(--bg-elev);
      border-radius: 999px; color: var(--fg); font-size: .9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input-wrap .icon-search {
      position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--fg-muted);
    }
    .search-input-wrap .icon-clear {
      position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border: 0; background: transparent;
      color: var(--fg-muted); border-radius: 50%; display: none;
    }
    .search-input-wrap.has-text .icon-clear { display: grid; place-items: center; }
    .search-input-wrap .icon-clear:hover { color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .75rem; align-items: center; }
    .chip {
      padding: .25rem .65rem; border-radius: 999px;
      border: 1px solid var(--border); background: transparent;
      color: var(--fg-muted); font-size: .75rem; font-weight: 500;
    }
    .chip:hover { color: var(--fg); }
    .chip.active {
      border-color: color-mix(in srgb, var(--fg) 40%, transparent);
      background: var(--surface); color: var(--fg);
    }
    .chip.active.olive { border-color: var(--olive); background: color-mix(in srgb, var(--olive) 12%, transparent); color: var(--olive); }
    .chip.active.accent { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .divider-v { width: 1px; height: 18px; background: var(--border); margin: 0 .25rem; }
    .sura-select {
      padding: .25rem .75rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--fg);
      font-size: .75rem;
    }
    .result-count { font-size: 11px; color: var(--fg-muted); margin-bottom: .75rem; }

    /* ---------- Stats ---------- */
    .stats-cards {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 640px) { .stats-cards { grid-template-columns: repeat(4, 1fr); } }
    .stats-panels {
      display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) { .stats-panels { grid-template-columns: 1fr 1fr; } }
    .bar-row { margin-bottom: .75rem; }
    .bar-label {
      display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: .25rem;
    }
    .bar-track { height: 10px; border-radius: 999px; background: var(--surface); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease-out; }
    .bar-fill.olive { background: var(--olive); }
    .bar-fill.accent { background: var(--accent); }
    .bar-fill.gradient { background: linear-gradient(to left, var(--accent), var(--olive)); }

    .top-suras-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    .top-sura {
      display: flex; align-items: center; gap: .75rem;
    }
    .top-sura .rank {
      display: grid; place-items: center; width: 32px; height: 32px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 50%; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .top-sura .body { flex: 1; min-width: 0; }
    .top-sura .row { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: .25rem; }

    /* ---------- Empty ---------- */
    .empty {
      border: 1px dashed var(--border); border-radius: 16px;
      padding: 2.5rem 1rem; text-align: center;
    }
    .empty p { margin: .25rem 0 0; color: var(--fg-muted); font-size: .9rem; }

    /* ---------- Sura header ---------- */
    .sura-header {
      position: relative; overflow: hidden;
      border: 1px solid var(--border); border-radius: 24px;
      background: var(--bg-elev); padding: 2rem 1.5rem; text-align: center;
      margin-bottom: 1.5rem;
    }
    .ornament-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
      opacity: .5; margin: 0 2rem;
    }
    .sura-header .label {
      font-family: 'Amiri', serif; font-size: 11px;
      letter-spacing: .25em; color: var(--accent); text-transform: uppercase;
    }
    .sura-header h1 { font-family: 'Amiri', serif; font-size: 2.5rem; font-weight: 900; margin: .5rem 0; }
    .sura-header .meta { color: var(--fg-muted); font-size: .9rem; }

    /* ---------- Footer ---------- */
    footer {
      text-align: center; padding: 2rem 1rem; font-size: .85rem; color: var(--fg-muted);
      border-top: 1px solid var(--border); margin-top: 2rem;
    }
    footer .verse-quote { font-family: 'Amiri', serif; margin: .75rem 0; }
    footer a { color: var(--accent); }

    /* ---------- About ---------- */
    .about-section { max-width: 720px; }
    .about-section ul.sources { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }
    .about-section ul.sources strong { display: block; }
    .about-section ul.sources .det { color: var(--fg-muted); font-size: .9rem; margin-top: 2px; }

    /* skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 0%, var(--border) 50%, var(--surface) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
      border-radius: 12px;
      height: 80px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* focus */
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a class="logo-link" href="#/">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 19V6a2 2 0 0 1 2-2h11l3 3v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
            <path d="M9 9c1.6 0 3 1.4 3 3s-1.4 3-3 3" />
          </svg>
        </span>
        <div>
          <div class="brand-title">مَنْ <span>و</span>مَنْ</div>
          <div class="brand-sub">في القرآن الكريم</div>
        </div>
      </a>
      <nav class="nav" id="nav">
        <a class="nav-btn" href="#/" data-route="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="nav-btn-text">السور</span>
        </a>
        <a class="nav-btn" href="#/search" data-route="/search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="nav-btn-text">بحث</span>
        </a>
        <a class="nav-btn" href="#/stats" data-route="/stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-3"/></svg>
          <span class="nav-btn-text">إحصاءات</span>
        </a>
        <a class="nav-btn" href="#/favorites" data-route="/favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="nav-btn-text">المفضّلة</span>
        </a>
        <a class="nav-btn" href="#/about" data-route="/about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span class="nav-btn-text">حول</span>
        </a>
        <button id="themeToggle" class="theme-btn" aria-label="تبديل المظهر">
          <span id="themeIcon"></span>
          <span id="themeLabel" class="nav-btn-text"></span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app">
    <div id="view-home" class="view"></div>
    <div id="view-sura" class="view"></div>
    <div id="view-verse" class="view"></div>
    <div id="view-search" class="view"></div>
    <div id="view-stats" class="view"></div>
    <div id="view-favorites" class="view"></div>
    <div id="view-about" class="view"></div>
    <div id="view-loading" class="view active">
      <div class="hero" style="padding:3rem; text-align:center;">
        <div class="pill">جارٍ التحميل…</div>
        <h1>مَنْ <span class="w">و</span>مَنْ</h1>
      </div>
      <div class="sura-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="ornament-line" style="margin:0 auto 1rem; max-width:160px;"></div>
    <div class="verse-quote">﴿ وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا ﴾</div>
    <a href="#/about">مصادر النصوص والتفاسير</a>
  </footer>

  <script>
  // ========== Utilities ==========
  const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr = n => String(n).replace(/\d/g, d => AR_DIGITS[+d]);
  const stripTashkeel = s => (s||'').normalize('NFKD').replace(/[ؐ-ًؚ-ٟۖ-ٰۭ]/g, '');
  const truncateWords = (s, max = 140) => {
    if (!s) return '';
    const t = stripTashkeel(s);
    if (t.length <= max) return t;
    const cut = t.slice(0, max);
    const last = cut.lastIndexOf(' ');
    return (last > 30 ? cut.slice(0, last) : cut) + '…';
  };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // ========== Theme ==========
  const THEME_KEY = 'man-wa-man:theme';
  function applyTheme(t) {
    const resolved = t === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : t;
    document.documentElement.classList.toggle('dark', resolved === 'dark');
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    const icons = {
      light: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
      dark:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      system:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    };
    icon.innerHTML = icons[t] || icons.light;
    label.textContent = t === 'system' ? 'تلقائي' : t === 'dark' ? 'ليلي' : 'نهاري';
  }
  let currentTheme = localStorage.getItem(THEME_KEY) || 'system';
  applyTheme(currentTheme);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (currentTheme === 'system') applyTheme('system');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    const order = ['light','dark','system'];
    currentTheme = order[(order.indexOf(currentTheme) + 1) % order.length];
    localStorage.setItem(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
  });

  // ========== Favorites & Prefs ==========
  const FAV_KEY = 'man-wa-man:favs';
  const PREFS_KEY = 'man-wa-man:prefs';
  const getFavs = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch { return new Set(); } };
  const setFavs = s => { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); };
  const toggleFav = id => { const s = getFavs(); s.has(id) ? s.delete(id) : s.add(id); setFavs(s); render(); };
  const getPrefs = () => {
    try { return Object.assign({ size: 3, tafsir: 'auto' }, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); }
    catch { return { size: 3, tafsir: 'auto' }; }
  };
  const setPrefs = p => { localStorage.setItem(PREFS_KEY, JSON.stringify(Object.assign(getPrefs(), p))); };

  // ========== Data ==========
  let DATA = null;
  let VERSES = [];
  let SURAS = [];

  async function loadData() {
    try {
      const r = await fetch('./verses.json');
      if (!r.ok) throw new Error('fetch failed');
      const j = await r.json();
      buildIndex(j);
    } catch (e) {
      // fallback inline (in case opened via file://)
      document.getElementById('view-loading').innerHTML =
        '<div class="empty"><h2 class="font-display">تعذّر تحميل البيانات</h2>' +
        '<p>تأكّد من وجود ملف <code>verses.json</code> بجوار <code>index.html</code>،' +
        ' أو شغّل خادمًا محلياً (مثل <code>python3 -m http.server</code>) ثم افتح الصفحة عبر <code>http://localhost:8000</code>.</p></div>';
      throw e;
    }
  }

  function buildIndex(j) {
    DATA = j;
    VERSES = [...j.verses].sort((a,b) =>
      a.sura_number !== b.sura_number ? a.sura_number - b.sura_number : a.aya_number - b.aya_number
    );
    const map = new Map();
    for (const v of VERSES) {
      if (!map.has(v.sura_number)) map.set(v.sura_number, {
        number: v.sura_number, name: v.sura_name, is_makki: v.metadata.is_makki, verses: []
      });
      map.get(v.sura_number).verses.push(v);
    }
    SURAS = [...map.values()].sort((a,b) => a.number - b.number);
  }

  const stats = () => ({
    totalVerses: VERSES.length,
    totalSuras: SURAS.length,
    man: VERSES.filter(v => v.starts_with === 'مَنْ').length,
    waman: VERSES.filter(v => v.starts_with === 'ومَنْ').length,
    makki: VERSES.filter(v => v.metadata.is_makki).length,
    madani: VERSES.filter(v => !v.metadata.is_makki).length,
    totalHidayat: VERSES.reduce((s,v) => s + (v.hidayat.items?.length || 0), 0),
    avgHidayat: VERSES.reduce((s,v) => s + (v.hidayat.items?.length || 0), 0) / VERSES.length,
  });

  // ========== Router ==========
  let currentRoute = { name: 'home', params: {} };
  function parseHash() {
    const h = (location.hash || '#/').slice(1);
    if (h === '/' || h === '') return { name: 'home' };
    const parts = h.split('/').filter(Boolean);
    if (parts[0] === 'sura' && parts[1]) return { name: 'sura', params: { number: Number(parts[1]) } };
    if (parts[0] === 'verse' && parts[1]) return { name: 'verse', params: { id: decodeURIComponent(parts.slice(1).join('/')) } };
    if (parts[0] === 'search') return { name: 'search' };
    if (parts[0] === 'stats') return { name: 'stats' };
    if (parts[0] === 'favorites') return { name: 'favorites' };
    if (parts[0] === 'about') return { name: 'about' };
    return { name: 'home' };
  }

  function setActiveNav() {
    const route = currentRoute.name;
    const map = { home: '/', sura: '/', search: '/search', stats: '/stats', favorites: '/favorites', about: '/about', verse: '/' };
    document.querySelectorAll('#nav .nav-btn').forEach(a => {
      a.classList.toggle('active', a.dataset.route === map[route]);
    });
  }

  // ========== Views ==========
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function renderHome() {
    const s = stats();
    const el = document.getElementById('view-home');
    el.innerHTML = `
      <section class="hero">
        <span class="pill">﴿ تدبّر القرآن ﴾</span>
        <h1>مَنْ <span class="w">و</span>مَنْ<br><small>في القرآن الكريم</small></h1>
        <p>جمعٌ لآيات القرآن المبدوءة بـ«مَنْ» و«ومَنْ» — ثمانٍ وسبعون آيةً، في ثمانٍ وثلاثين سورة — مع التفسيرين «المختصر» و«الميسّر»، والهدايات القرآنية.</p>
        <div class="hero-actions">
          <a class="btn primary" href="#/search">ابدأ التصفّح
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </a>
          <a class="btn" href="#/stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-3"/></svg>
            لطائف ختامية
          </a>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-num">${toAr(s.totalVerses)}</div><div class="stat-label">آية</div></div>
          <div class="stat-card"><div class="stat-num">${toAr(s.totalSuras)}</div><div class="stat-label">سورة</div></div>
          <div class="stat-card"><div class="stat-num olive">${toAr(s.man)}</div><div class="stat-label">«مَنْ»</div></div>
          <div class="stat-card"><div class="stat-num accent">${toAr(s.waman)}</div><div class="stat-label">«ومَنْ»</div></div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <div>
            <h2>السور</h2>
            <p>${toAr(s.totalSuras)} سورة تضم ${toAr(s.totalVerses)} آية</p>
          </div>
          <a class="btn" href="#/search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            بحث متقدّم
          </a>
        </div>
        <div class="sura-grid">
          ${SURAS.map(suraCard).join('')}
        </div>
      </section>
    `;
    showView('view-home');
  }

  function suraCard(s) {
    const man = s.verses.filter(v => v.starts_with === 'مَنْ').length;
    const waman = s.verses.filter(v => v.starts_with === 'ومَنْ').length;
    return `
      <a class="sura-card" href="#/sura/${s.number}">
        <div class="sura-num">
          <svg viewBox="0 0 48 48"><polygon points="24,2 30,12 42,12 36,22 42,32 30,32 24,42 18,32 6,32 12,22 6,12 18,12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>${toAr(s.number)}</span>
        </div>
        <div class="sura-info">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;">
            <h3>${escapeHtml(s.name)}</h3>
            <span style="font-size:11px;color:var(--fg-muted);">${s.is_makki ? 'مكية' : 'مدنية'}</span>
          </div>
          <div class="sura-meta">
            <span>${toAr(s.verses.length)} آية</span>
            <span>•</span>
            <span>
              ${man > 0 ? '<span class="badge-olive">مَنْ</span>' : ''}
              ${man > 0 && waman > 0 ? ' · ' : ''}
              ${waman > 0 ? '<span class="badge-accent">ومَنْ</span>' : ''}
            </span>
          </div>
        </div>
      </a>
    `;
  }

  function renderSura(number) {
    const sura = SURAS.find(s => s.number === number);
    const el = document.getElementById('view-sura');
    if (!sura) { el.innerHTML = '<div class="empty"><h2>السورة غير موجودة</h2></div>'; showView('view-sura'); return; }
    const idx = SURAS.findIndex(s => s.number === number);
    const prevS = idx > 0 ? SURAS[idx-1] : null;
    const nextS = idx < SURAS.length-1 ? SURAS[idx+1] : null;
    el.innerHTML = `
      <div class="breadcrumb">
        <a href="#/">‹ كل السور</a>
        <span>سورة رقم ${toAr(sura.number)}</span>
      </div>
      <header class="sura-header">
        <div class="ornament-line" style="position:absolute;top:.75rem;left:2rem;right:2rem;"></div>
        <div class="label">سورة</div>
        <h1>${escapeHtml(sura.name)}</h1>
        <div class="meta">${sura.is_makki ? 'مكية' : 'مدنية'} • ${toAr(sura.verses.length)} آية «مَنْ/ومَنْ»</div>
        <div class="ornament-line" style="position:absolute;bottom:.75rem;left:2rem;right:2rem;"></div>
      </header>
      <ul class="verses-list" style="list-style:none;padding:0;margin:0;">
        ${sura.verses.map(v => `<li>${verseCard(v, false)}</li>`).join('')}
      </ul>
      <nav class="nav-row">
        ${prevS ? `<a class="nav-link prev" href="#/sura/${prevS.number}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <div><div class="meta">السورة السابقة</div><div class="name">${escapeHtml(prevS.name)}</div></div>
        </a>` : '<span style="flex:1"></span>'}
        ${nextS ? `<a class="nav-link next" href="#/sura/${nextS.number}">
          <div><div class="meta">السورة التالية</div><div class="name">${escapeHtml(nextS.name)}</div></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>` : '<span style="flex:1"></span>'}
      </nav>
    `;
    showView('view-sura');
  }

  function verseCard(v, showSura) {
    return `
      <a class="verse-card" href="#/verse/${encodeURIComponent(v.id)}">
        <div class="verse-card-head">
          <div style="display:flex;align-items:center;gap:.5rem;">
            <span class="tag ${v.starts_with === 'مَنْ' ? 'man' : 'waman'}">${escapeHtml(v.starts_with)}</span>
            ${showSura ? `<span class="sura-label">${escapeHtml(v.sura_name)}</span>` : ''}
          </div>
          <span class="ayah-num">${toAr(v.aya_number)}</span>
        </div>
        <p class="verse-text quran">${escapeHtml(v.verse_text)}</p>
        <p class="preview">${escapeHtml(truncateWords(v.tafsir.mokhtasr, 150))}</p>
      </a>
    `;
  }

  function renderVerse(id) {
    const i = VERSES.findIndex(v => v.id === id);
    const el = document.getElementById('view-verse');
    if (i === -1) { el.innerHTML = '<div class="empty"><h2>الآية غير موجودة</h2></div>'; showView('view-verse'); return; }
    const v = VERSES[i];
    const prev = i > 0 ? VERSES[i-1] : null;
    const next = i < VERSES.length - 1 ? VERSES[i+1] : null;
    const prefs = getPrefs();
    const isFav = getFavs().has(v.id);

    const autoTafsir = (v.tafsir.mokhtasr || '').length <= (v.tafsir.moyassar || '').length ? 'mokhtasr' : 'moyassar';
    const activeTafsir = prefs.tafsir === 'auto' ? autoTafsir : prefs.tafsir;

    el.innerHTML = `
      <nav class="breadcrumb">
        <div style="display:flex;align-items:center;gap:.4rem;">
          <a href="#/">السور</a><span>›</span>
          <a href="#/sura/${v.sura_number}">${escapeHtml(v.sura_name)}</a><span>›</span>
          <span style="color:var(--fg);">آية ${toAr(v.aya_number)}</span>
        </div>
        <span style="font-size:11px;">صفحة ${toAr(v.page)}</span>
      </nav>

      <div class="verse-frame" id="verseFrame">
        <div class="top-row">
          <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
            <span class="tag ${v.starts_with === 'مَنْ' ? 'man' : 'waman'}">تبدأ بـ «${escapeHtml(v.starts_with)}»</span>
            <span class="tag" style="background:var(--surface);color:var(--fg-muted);">${v.metadata.is_makki ? 'مكية' : 'مدنية'}</span>
          </div>
          <div class="font-display" style="font-size:.85rem;color:var(--fg-muted);">${escapeHtml(v.sura_name)} · ${toAr(v.aya_number)}</div>
        </div>
        <div class="verse-detail-text size-${prefs.size}">
          <span class="ornament" aria-hidden="true">﴿</span>
          <span class="quran-text">${escapeHtml(v.verse_text)}</span>
          <span class="ayah-marker" aria-hidden="true">${toAr(v.aya_number)}</span>
          <span class="ornament" aria-hidden="true">﴾</span>
        </div>
      </div>

      <div class="actions-row">
        <div class="group">
          <button class="btn btn-fav ${isFav ? 'active' : ''}" data-action="fav">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${isFav ? 'في المفضّلة' : 'أضف للمفضّلة'}
          </button>
          <button class="btn" data-action="size">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            حجم الخط (${toAr(prefs.size)}/٤)
          </button>
        </div>
        <div class="group">
          <button class="btn" data-action="copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="copy-label">نسخ</span>
          </button>
          <button class="btn primary" data-action="share">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
            مشاركة
          </button>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>التفسير</h2>
          <div class="tab-group">
            <button class="tab-btn ${activeTafsir === 'mokhtasr' ? 'active' : ''}" data-tafsir="mokhtasr">المختصر</button>
            <button class="tab-btn ${activeTafsir === 'moyassar' ? 'active' : ''}" data-tafsir="moyassar">الميسر</button>
          </div>
        </div>
        <p id="tafsirBody" style="line-height:1.85;">${escapeHtml(v.tafsir[activeTafsir] || '')}</p>
      </section>

      ${(v.word_meanings.seraj || '').trim() ? `
        <section class="panel">
          <div class="panel-head"><h2>معاني الكلمات</h2></div>
          <p>${escapeHtml(v.word_meanings.seraj)}</p>
        </section>` : ''}

      ${(v.hidayat.items && v.hidayat.items.length) ? `
        <section class="panel">
          <div class="panel-head"><h2>الهدايات</h2><span class="count">${toAr(v.hidayat.items.length)} هداية</span></div>
          <ol class="hidayat-list">
            ${v.hidayat.items.map((h,i) => `<li class="hidayat-item" data-n="${toAr(i+1)}">${escapeHtml(h)}</li>`).join('')}
          </ol>
        </section>` : ''}

      ${(v.reflection_question || '').trim() ? `
        <section class="reflection">
          <h2 class="font-display">سؤال للتأمّل</h2>
          <p>${escapeHtml(v.reflection_question)}</p>
        </section>` : ''}

      <nav class="nav-row">
        ${prev ? `<a class="nav-link prev" href="#/verse/${encodeURIComponent(prev.id)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <div><div class="meta">الآية السابقة</div><div class="name">${escapeHtml(prev.sura_name)} · ${toAr(prev.aya_number)}</div></div>
        </a>` : '<span style="flex:1"></span>'}
        ${next ? `<a class="nav-link next" href="#/verse/${encodeURIComponent(next.id)}">
          <div><div class="meta">الآية التالية</div><div class="name">${escapeHtml(next.sura_name)} · ${toAr(next.aya_number)}</div></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>` : '<span style="flex:1"></span>'}
      </nav>
      <p class="keyboard-hint">تنقّل بالأسهم ← → · غيّر حجم الخط بـ +</p>
    `;

    // Wire actions
    el.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.tafsir;
      setPrefs({ tafsir: k });
      el.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x.dataset.tafsir === k));
      const body = document.getElementById('tafsirBody');
      body.style.animation = 'none'; body.offsetHeight;
      body.style.animation = 'fadeUp .35s ease-out';
      body.textContent = v.tafsir[k] || '';
    }));

    el.querySelector('[data-action="fav"]').addEventListener('click', () => toggleFav(v.id));
    el.querySelector('[data-action="size"]').addEventListener('click', () => {
      const cur = getPrefs().size;
      setPrefs({ size: cur >= 4 ? 1 : cur + 1 });
      render();
    });
    el.querySelector('[data-action="copy"]').addEventListener('click', async (e) => {
      const text = `${v.verse_text}\n\n[${v.sura_name} : ${v.aya_number}]`;
      try {
        await navigator.clipboard.writeText(text);
        e.currentTarget.querySelector('.copy-label').textContent = 'تم النسخ ✓';
        setTimeout(() => { e.currentTarget.querySelector('.copy-label').textContent = 'نسخ'; }, 1500);
      } catch {}
    });
    el.querySelector('[data-action="share"]').addEventListener('click', async () => {
      const text = `${v.verse_text}\n\n[${v.sura_name} : ${v.aya_number}]`;
      if (navigator.share) {
        try { await navigator.share({ title: `${v.sura_name} ${v.aya_number}`, text, url: location.href }); return; } catch {}
      }
      try { await navigator.clipboard.writeText(text); alert('نُسخت الآية إلى الحافظة'); } catch {}
    });

    showView('view-verse');
  }

  // ========== Search ==========
  let searchState = { q: '', starts_with: 'all', origin: 'all', sura: '' };

  function renderSearch() {
    const el = document.getElementById('view-search');
    el.innerHTML = `
      <header style="margin-bottom:1rem;">
        <h1 class="font-display" style="font-size:1.85rem;margin:0;font-weight:900;">البحث والتصفية</h1>
        <p style="color:var(--fg-muted);font-size:.9rem;margin:.25rem 0 0;">ابحث في نصوص الآيات والتفاسير والهدايات، أو صفّ النتائج.</p>
      </header>
      <div class="search-bar">
        <div class="search-input-wrap ${searchState.q ? 'has-text' : ''}">
          <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" class="search-input" type="search" placeholder="ابحث في الآيات أو التفاسير أو الهدايات…" value="${escapeHtml(searchState.q)}" autofocus />
          <button class="icon-clear" id="searchClear" aria-label="مسح">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="chips">
          <button class="chip ${searchState.starts_with === 'all' ? 'active' : ''}" data-sw="all">الكل</button>
          <button class="chip ${searchState.starts_with === 'مَنْ' ? 'active olive' : ''}" data-sw="مَنْ">«مَنْ»</button>
          <button class="chip ${searchState.starts_with === 'ومَنْ' ? 'active accent' : ''}" data-sw="ومَنْ">«ومَنْ»</button>
          <span class="divider-v"></span>
          <button class="chip ${searchState.origin === 'all' ? 'active' : ''}" data-or="all">مكي/مدني</button>
          <button class="chip ${searchState.origin === 'makki' ? 'active' : ''}" data-or="makki">مكية</button>
          <button class="chip ${searchState.origin === 'madani' ? 'active' : ''}" data-or="madani">مدنية</button>
          <span class="divider-v"></span>
          <select id="suraSelect" class="sura-select">
            <option value="">كل السور</option>
            ${SURAS.map(s => `<option value="${s.number}" ${String(searchState.sura) === String(s.number) ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="result-count" id="resultCount"></div>
      <ul id="results" class="verses-list" style="list-style:none;padding:0;margin:0;"></ul>
    `;

    const runSearch = () => {
      let pool = VERSES;
      if (searchState.starts_with !== 'all') pool = pool.filter(v => v.starts_with === searchState.starts_with);
      if (searchState.origin !== 'all') pool = pool.filter(v => searchState.origin === 'makki' ? v.metadata.is_makki : !v.metadata.is_makki);
      if (searchState.sura) pool = pool.filter(v => String(v.sura_number) === String(searchState.sura));
      const q = stripTashkeel(searchState.q.trim());
      let results;
      if (!q) {
        results = pool;
      } else {
        results = pool.filter(v => {
          const haystack = stripTashkeel(
            v.verse_text + '\n' + v.sura_name + '\n' +
            v.tafsir.mokhtasr + '\n' + v.tafsir.moyassar + '\n' +
            (v.hidayat.items || []).join('\n') + '\n' + (v.word_meanings.seraj || '')
          );
          return haystack.includes(q);
        });
      }
      const cnt = document.getElementById('resultCount');
      cnt.textContent = `${toAr(results.length)} نتيجة${searchState.q ? ` لـ «${searchState.q}»` : ''}`;
      const list = document.getElementById('results');
      if (results.length === 0) {
        list.innerHTML = '<li class="empty"><h2 class="font-display">لا توجد نتائج</h2><p>جرّب كلمات أخرى أو غيّر الفلاتر.</p></li>';
      } else {
        list.innerHTML = results.map(v => `<li>${verseCard(v, true)}</li>`).join('');
      }
    };

    const input = document.getElementById('searchInput');
    let t;
    input.addEventListener('input', e => {
      searchState.q = e.target.value;
      document.querySelector('.search-input-wrap').classList.toggle('has-text', !!searchState.q);
      clearTimeout(t); t = setTimeout(runSearch, 100);
    });
    document.getElementById('searchClear').addEventListener('click', () => {
      searchState.q = ''; input.value = '';
      document.querySelector('.search-input-wrap').classList.remove('has-text');
      runSearch(); input.focus();
    });
    el.querySelectorAll('[data-sw]').forEach(b => b.addEventListener('click', () => {
      searchState.starts_with = b.dataset.sw; renderSearch();
    }));
    el.querySelectorAll('[data-or]').forEach(b => b.addEventListener('click', () => {
      searchState.origin = b.dataset.or; renderSearch();
    }));
    document.getElementById('suraSelect').addEventListener('change', e => {
      searchState.sura = e.target.value; runSearch();
    });

    runSearch();
    showView('view-search');
  }

  // ========== Stats ==========
  function renderStats() {
    const s = stats();
    const max = Math.max(...SURAS.map(x => x.verses.length));
    const topSuras = [...SURAS].sort((a,b) => b.verses.length - a.verses.length).slice(0, 10);
    const manPct = (s.man / s.totalVerses) * 100;
    const wamanPct = 100 - manPct;
    const makkiPct = (s.makki / s.totalVerses) * 100;
    const madaniPct = 100 - makkiPct;

    const el = document.getElementById('view-stats');
    el.innerHTML = `
      <header style="margin-bottom:1.5rem;">
        <h1 class="font-display" style="font-size:1.85rem;font-weight:900;margin:0;">إحصاءات ولطائف</h1>
        <p style="color:var(--fg-muted);font-size:.9rem;margin:.25rem 0 0;">أرقام موجزة عن آيات «مَنْ» و«ومَنْ» في القرآن الكريم.</p>
      </header>
      <div class="stats-cards">
        <div class="stat-card"><div class="stat-num">${toAr(s.totalVerses)}</div><div class="stat-label">مجموع الآيات</div></div>
        <div class="stat-card"><div class="stat-num">${toAr(s.totalSuras)}</div><div class="stat-label">عدد السور</div></div>
        <div class="stat-card"><div class="stat-num accent">${toAr(s.totalHidayat)}</div><div class="stat-label">مجموع الهدايات</div></div>
        <div class="stat-card"><div class="stat-num accent">${s.avgHidayat.toFixed(1)}</div><div class="stat-label">معدّل الهدايات لكل آية</div></div>
      </div>

      <div class="stats-panels">
        <div class="panel">
          <div class="panel-head"><h2>نوع البداية</h2></div>
          ${barRow('«مَنْ»', s.man, manPct, 'olive')}
          ${barRow('«ومَنْ»', s.waman, wamanPct, 'accent')}
        </div>
        <div class="panel">
          <div class="panel-head"><h2>مكي / مدني</h2></div>
          ${barRow('مكية', s.makki, makkiPct, 'olive')}
          ${barRow('مدنية', s.madani, madaniPct, 'accent')}
        </div>
      </div>

      <section style="margin-bottom:1.5rem;">
        <h2 class="font-display" style="font-size:1.2rem;margin:0 0 .75rem;">أكثر السور وروداً</h2>
        <div class="panel">
          <ol class="top-suras-list">
            ${topSuras.map((s, i) => `
              <li class="top-sura">
                <span class="rank">${toAr(i+1)}</span>
                <div class="body">
                  <div class="row">
                    <a class="font-display" style="font-weight:700;" href="#/sura/${s.number}">${escapeHtml(s.name)}</a>
                    <span style="color:var(--fg-muted);">${toAr(s.verses.length)} آية</span>
                  </div>
                  <div class="bar-track"><div class="bar-fill gradient" style="width:${(s.verses.length/max)*100}%"></div></div>
                </div>
              </li>
            `).join('')}
          </ol>
        </div>
      </section>

      <section class="reflection">
        <h2 class="font-display">لطيفة ختاميّة</h2>
        <p>﴿ مَنْ يَعْمَلْ سُوءًا يُجْزَ بِهِ ﴾ — ورد لفظ «مَنْ» الشرطيُّ في القرآن مرتبطًا بأركان الإيمان والعمل والابتلاء؛ ومنه ما عُطف بالواو لِيُضمَّ إلى ما قبله، فجاءت «ومَنْ» أكثر وروداً (${toAr(s.waman)} مرة) من «مَنْ» (${toAr(s.man)} مرة).</p>
      </section>
    `;
    showView('view-stats');
  }

  function barRow(label, count, pct, cls) {
    return `
      <div class="bar-row">
        <div class="bar-label"><span style="font-weight:500;">${label}</span><span style="color:var(--fg-muted);">${toAr(count)} (${pct.toFixed(0)}%)</span></div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  // ========== Favorites ==========
  function renderFavorites() {
    const favSet = getFavs();
    const favs = VERSES.filter(v => favSet.has(v.id));
    const el = document.getElementById('view-favorites');
    el.innerHTML = `
      <header style="margin-bottom:1.5rem;">
        <h1 class="font-display" style="font-size:1.85rem;font-weight:900;margin:0;">المفضّلة</h1>
        <p style="color:var(--fg-muted);font-size:.9rem;margin:.25rem 0 0;">الآيات التي حفظتها محليّاً في متصفّحك.</p>
      </header>
      ${favs.length === 0 ? `
        <div class="empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin:auto;display:block;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <h2 class="font-display" style="margin:.75rem 0 0;">لا توجد مفضّلة بعد</h2>
          <p>اضغط على القلب في أي آية لإضافتها هنا.</p>
          <a class="btn primary" href="#/" style="margin-top:1rem;">تصفّح السور</a>
        </div>
      ` : `<ul class="verses-list" style="list-style:none;padding:0;margin:0;">${favs.map(v => `<li>${verseCard(v, true)}</li>`).join('')}</ul>`}
    `;
    showView('view-favorites');
  }

  // ========== About ==========
  function renderAbout() {
    const el = document.getElementById('view-about');
    el.innerHTML = `
      <div class="about-section">
        <header style="margin-bottom:1.5rem;">
          <h1 class="font-display" style="font-size:1.85rem;font-weight:900;margin:0;">حول التطبيق</h1>
          <p style="color:var(--fg-muted);margin:.5rem 0 0;line-height:1.7;">
            هذا التطبيق يجمع ٧٨ آية من القرآن الكريم تبدأ بـ«مَنْ» أو «ومَنْ»،
            مع تفسيرين وهداياتٍ من مصادر موثوقة. الهدف: تيسير القراءة والتدبّر
            والتأمّل في هذه الصيغ القرآنية.
          </p>
        </header>
        <div class="panel">
          <h2 class="font-display" style="margin:0 0 1rem;font-size:1.2rem;">المصادر</h2>
          <ul class="sources">
            <li><strong>نص القرآن</strong><div class="det">رواية حفص عن عاصم — الرسم العثماني</div></li>
            <li><strong>التفسير المختصر</strong><div class="det">مركز تفسير للدراسات القرآنية — <a href="https://mokhtasr.com" target="_blank" rel="noreferrer">mokhtasr.com</a></div></li>
            <li><strong>التفسير الميسر</strong><div class="det">مجمع الملك فهد لطباعة المصحف الشريف</div></li>
            <li><strong>الهدايات</strong><div class="det">موسوعة الهدايات القرآنية — مركز مكة العالمي للهدى القرآني — <a href="https://hidayaaencyc.net" target="_blank" rel="noreferrer">hidayaaencyc.net</a></div></li>
            <li><strong>معاني الكلمات</strong><div class="det">السراج في بيان غريب القرآن</div></li>
          </ul>
        </div>
        <div class="panel">
          <h2 class="font-display" style="margin:0 0 .75rem;font-size:1.2rem;">ملاحظات</h2>
          <ul style="padding-right:1.25rem;line-height:1.85;font-size:.9rem;">
            <li>التشكيل الكامل محفوظ في نصوص الآيات (الرسم العثماني لرواية حفص).</li>
            <li>عند توافر التفسيرين، يُختار الأقصر افتراضياً مع تبويب للتنقّل بينهما.</li>
            <li>معاني الكلمات تظهر إن وُجدت فقط، ولا يُعرض القسم خالياً.</li>
            <li>الواجهة عربية بالكامل (RTL) وتدعم الوضع الليلي ومقاسات خطوط متعدّدة.</li>
            <li>تنقّل بالأسهم ← → في صفحة الآية، و«+» لتغيير حجم الخط.</li>
          </ul>
        </div>
      </div>
    `;
    showView('view-about');
  }

  // ========== Router driver ==========
  function render() {
    currentRoute = parseHash();
    setActiveNav();
    if (!DATA) { showView('view-loading'); return; }
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    switch (currentRoute.name) {
      case 'home': return renderHome();
      case 'sura': return renderSura(currentRoute.params.number);
      case 'verse': return renderVerse(currentRoute.params.id);
      case 'search': return renderSearch();
      case 'stats': return renderStats();
      case 'favorites': return renderFavorites();
      case 'about': return renderAbout();
      default: return renderHome();
    }
  }

  // Keyboard shortcuts (on verse view)
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    if (currentRoute.name !== 'verse') return;
    const i = VERSES.findIndex(v => v.id === currentRoute.params.id);
    if (i === -1) return;
    if (e.key === 'ArrowLeft' && i < VERSES.length - 1) location.hash = '#/verse/' + encodeURIComponent(VERSES[i+1].id);
    if (e.key === 'ArrowRight' && i > 0) location.hash = '#/verse/' + encodeURIComponent(VERSES[i-1].id);
    if (e.key === '+' || e.key === '=') {
      const cur = getPrefs().size;
      setPrefs({ size: cur >= 4 ? 1 : cur + 1 });
      render();
    }
  });

  window.addEventListener('hashchange', render);

  // Boot
  loadData().then(render).catch(() => {});
  </script>
</body>
</html>
